vo=gpu
profile=gpu-hq
hwdec=yes

# General settings
keep-open=always 
# save-position-on-quit=yes
cursor-autohide=100
osc = no # default osc interferes with thumbnail script osc

# Screenshots
screenshot-sw=no
screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-png-compression=1
screenshot-jpeg-quality = 100

# Subtitles
demuxer-mkv-subtitle-preroll=yes

# Sub/Audio track language priority
slang=enm,en,eng,enUS
alang=ja,jp,jpn,en,eng